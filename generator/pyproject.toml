[project]
name = "double-cross-precompute"
version = "0.1.0"
description = "Offline probability-table generator for Double Cross Dice Calculator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
]

[project.scripts]
dx-precompute = "dx_precompute.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "scipy>=1.16,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dx_precompute"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
