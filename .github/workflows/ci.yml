name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      reference: ${{ steps.scope.outputs.reference }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect verification scopes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "reference=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          browser=false
          reference=false
          while IFS= read -r path; do
            case "$path" in
              public/data/*|package.json|package-lock.json|.github/workflows/ci.yml|vitest.config.js|vitest.reference.config.js)
                browser=true
                reference=true
                ;;
              src/*|public/*|index.html|vite.config.js|scripts/production-browser-smoke.mjs)
                browser=true
                ;;
              generator/*|tooling/reference-data/*|tests/reference/*|scripts/verify-runtime-dx.mjs|pytest.ini|uv.lock)
                reference=true
                ;;
              *)
                # Unknown paths run both non-core gates for safety.
                browser=true
                reference=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  core:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify core
        env:
          DIFF_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_CHECK_HEAD: ${{ github.sha }}
        run: npm run verify:core

  browser:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser
        run: npm run verify:browser

  reference:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.reference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: npm ci

      - name: Install generator dependencies
        run: uv sync --project generator --locked --dev

      - name: Verify reference
        run: npm run verify:reference
