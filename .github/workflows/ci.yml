name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: npm ci

      - name: Install generator dependencies
        run: uv sync --project generator --locked --dev

      - name: Validate precomputed data
        run: |
          npm run data:check
          npm run data:verify-generator

      - name: Lint
        run: |
          npm run lint
          npm run lint:markdown
          npm run generator:lint

      - name: Test
        run: |
          npm run typecheck
          npm run verify:runtime-dx
          npm test
          npm run generator:test
          npm run generator:test:simulation

      - name: Build
        run: npm run build
